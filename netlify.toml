[build]
  command = "npm run build"
  publish = "dist/client"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/f/*"
  to = "/.netlify/functions/api/f/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
